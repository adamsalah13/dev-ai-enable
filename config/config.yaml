# Fintech AI Enable Labs Configuration

# Data sources
data:
  default_source: "yahoo_finance"
  cache_enabled: true
  cache_duration: 3600  # seconds
  
# Model settings
models:
  default_model: "random_forest"
  validation_split: 0.2
  random_seed: 42
  
  random_forest:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    
  xgboost:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
    subsample: 0.8
    
# Features
features:
  technical_indicators:
    - SMA_20
    - SMA_50
    - RSI
    - Volatility
    - Price_Change
    
  fundamental_indicators:
    - PE_ratio
    - PB_ratio
    - ROE
    - Debt_to_Equity

# API settings
api:
  timeout: 30
  retry_attempts: 3
  rate_limit: 100  # requests per minute

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/fintech_ai.log"

# Environment
environment:
  development:
    debug: true
    log_level: "DEBUG"
  
  production:
    debug: false
    log_level: "WARNING"